# galaxIA-Core — Docker Compose P2P (DEC-0088)
# Atlas = pure bootstrap peer libp2p (sin WebSocket de registro).
# Navigator = orquestador P2P: publica OFFER, recibe BID/ASSIGN, abre stream directo.
# Portal-chat = frontend HTTPS-only; el chat usa libp2p/WSS directamente.
#
# network_mode: host en atlas/navigator (E2E-023, docs/historial-incidencias-e2e.md):
# en podman rootless (pasta/slirp4netns), un contenedor NO puede alcanzar a otro
# contenedor del MISMO host a través de la IP externa publicada del host
# (hairpin NAT no soportado). Atlas siempre anuncia su IP externa real al swarm
# (la necesitan los peers de OTROS hosts) — cualquier peer P2P co-ubicado en el
# mismo host que Atlas debe usar network_mode: host para poder dialearla. Esto
# es necesario incluso si Atlas y Navigator solo se comunican "localmente".
#
# Orden de arranque:
#   1. podman-compose up -d atlas          → anotar la multiaddr del log
#   2. export FHS_BOOTSTRAP_ADDRS=<multiaddr-atlas>
#   3. podman-compose up -d navigator
#   4. Providers (galaxIA-satellite-star/containers/compose.yaml) con el mismo FHS_BOOTSTRAP_ADDRS
#      — si un provider corre en el MISMO host que Atlas, también necesita
#      network_mode: host (ver comentario arriba).

services:
  atlas:
    build:
      context: ..
      dockerfile: containers/atlas/Containerfile
    container_name: fhs-atlas
    network_mode: host
    environment:
      - PORT=8081
      - HOST=0.0.0.0
      - FHS_LISTEN_ADDRS=/ip4/0.0.0.0/tcp/4001/tls/ws
      - TLS_CERT_PATH=${TLS_CERT_PATH:-/certs/dev.crt}
      - TLS_KEY_PATH=${TLS_KEY_PATH:-/certs/dev.key}
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-/certs/dev.crt}
      - IDENTITY_KEY_PATH=/app/apps/atlas/data/.fhs-identity-atlas.json
    volumes:
      - atlas-data:/app/apps/atlas/data
      - ${CERTS_DIR:-../certs}:/certs:ro
    restart: unless-stopped

  navigator:
    build:
      context: ..
      dockerfile: containers/navigator/Containerfile
    container_name: fhs-navigator
    network_mode: host
    environment:
      - PORT=8090
      - HOST=0.0.0.0
      - FHS_LISTEN_ADDRS=/ip4/0.0.0.0/tcp/4010/tls/ws
      - TLS_CERT_PATH=${TLS_CERT_PATH:-/certs/dev.crt}
      - TLS_KEY_PATH=${TLS_KEY_PATH:-/certs/dev.key}
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-/certs/dev.crt}
      # FHS_BOOTSTRAP_ADDRS se pasa como variable de entorno del host antes de levantar
      # El portal recibe una o más direcciones TLS de bootstrap del swarm; el
      # peer id se aprende durante Identify/Noise y el handshake FHS firmado.
      - FHS_BOOTSTRAP_ADDRS=${FHS_BOOTSTRAP_ADDRS:-}
      - FHS_ANNOUNCE_ADDRS=${FHS_ANNOUNCE_ADDRS:-}
    volumes:
      - ${CERTS_DIR:-../certs}:/certs:ro
    depends_on:
      - atlas
    restart: unless-stopped

  portal-chat:
    build:
      context: ..
      dockerfile: containers/portal-chat/Containerfile
    container_name: fhs-portal-chat
    ports:
      - "${PORTAL_PORT:-8443}:443"
    environment:
      - PORTAL_CERT_CN=${PORTAL_CERT_CN:-localhost}
      - PORTAL_CERT_SAN=${PORTAL_CERT_SAN:-DNS:localhost,IP:127.0.0.1}
      - FHS_BOOTSTRAP_ADDRS=${FHS_BOOTSTRAP_ADDRS:-}
    # Persist the browser-facing certificate across container recreation.
    # Otherwise every redeploy invalidates the Firefox security exception.
    volumes:
      - ${PORTAL_CERTS_DIR:-../certs/portal-chat}:/etc/nginx/certs
    depends_on:
      - navigator
      - atlas
    networks:
      - fhs
    restart: unless-stopped

networks:
  fhs:
    name: fhs
    driver: bridge

volumes:
  atlas-data:
