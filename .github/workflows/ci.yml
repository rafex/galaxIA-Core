name: CI

# Validación de Pull Requests.
# No publica ni despliega nada — solo bloquea el merge si lint, typecheck, test o build fallan.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint --workspaces
      - run: npm run lint:scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck --workspaces

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
      - name: Instalar dependencias
        # El lockfile se genera en macOS ARM — no incluye binarios nativos
        # para linux-x64 (DEC-0042). Se borra y reinstala.
        run: |
          rm -f package-lock.json
          npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test --workspaces

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
      - name: Instalar dependencias
        run: |
          rm -f package-lock.json
          npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (todos los workspaces)
        run: npm run build --workspaces

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
      - name: Instalar dependencias
        run: |
          rm -f package-lock.json
          npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (atlas, navigator)
        run: |
          npm run build -w apps/atlas
          npm run build -w apps/navigator
      - name: Levantar Atlas + Navigator y correr el smoke E2E
        run: |
          PORT=8081 HOST=127.0.0.1 MDNS_ENABLED=false \
            ATLAS_DB_PATH=/tmp/e2e-atlas.db IDENTITY_KEY_PATH=/tmp/e2e-atlas-id.pem \
            node apps/atlas/dist/index.js > /tmp/atlas.log 2>&1 &
          PORT=8090 HOST=127.0.0.1 ATLAS_URL=http://127.0.0.1:8081 \
            NAVIGATOR_IDENTITY_KEY_PATH=/tmp/e2e-nav-id.pem \
            node apps/navigator/dist/index.js > /tmp/navigator.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8081/health >/dev/null && curl -sf http://127.0.0.1:8090/health >/dev/null && break
            sleep 1
          done
          ATLAS_URL=http://127.0.0.1:8081 NAVIGATOR_URL=http://127.0.0.1:8090 npx tsx scripts/e2e-smoke.ts
      - name: Logs de Atlas/Navigator (siempre)
        if: always()
        run: |
          echo "::group::atlas.log"; cat /tmp/atlas.log || true; echo "::endgroup::"
          echo "::group::navigator.log"; cat /tmp/navigator.log || true; echo "::endgroup::"
