name: CI

# Validación de Pull Requests.
# No publica ni despliega nada — solo bloquea el merge si lint, typecheck, test o build fallan.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint --workspaces
      - run: npm run lint:scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir dependencia workspace fhs-node
        run: npm run build -w packages/fhs-node
      - run: npm run typecheck --workspaces

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Instalar dependencias
        # El lockfile se genera en macOS ARM — no incluye binarios nativos
        # para linux-x64 (DEC-0042). Se borra y reinstala.
        run: |
          rm -f package-lock.json
          npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generar certificado HTTPS de pruebas del portal
        run: npm run generate:cert -w apps/portal-chat
      - run: npm run test --workspaces

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Instalar dependencias
        run: |
          rm -f package-lock.json
          npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (todos los workspaces)
        run: |
          npm run build -w packages/fhs-node
          npm run build --workspaces

  p2p-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Instalar dependencias
        run: |
          rm -f package-lock.json
          npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (Atlas, Navigator)
        run: |
          npm run build -w packages/fhs-node
          npm run build -w apps/atlas
          npm run build -w apps/navigator
      - name: Smoke de transporte P2P libp2p
        run: npm run test -w packages/fhs-node
